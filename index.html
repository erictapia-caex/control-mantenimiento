<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Mantenimiento</title>
<meta name="theme-color" content="#081020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F2F2EF;font-family:Barlow,system-ui,sans-serif;color:#1B1D1F}
button{font-family:inherit}
#app{position:relative;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#F2F2EF}
.top{background:#1E2428;color:#FFF;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{height:44px;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;border:2px solid #48525A;background:transparent;color:#FFF}
.tab.on{border-color:#F2B705;background:#F2B705;color:#1B1D1F}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:6px;border-radius:3px;background:#48525A}
.bar.on{background:#F2B705}.bar.bad{background:#E5484D}
.sub{font-size:16px;color:#D5D9DC}
.body{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:24px}
.lbl{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#4A4F55;margin-bottom:8px}
.lerr{color:#B3261E}
.hint{font-size:14px;color:#5A6067}
.fld{width:100%;height:52px;border:2px solid #C9CCCF;border-radius:10px;background:#FFF;padding:0 14px;font-family:inherit;font-size:18px;font-weight:600;color:#1B1D1F}
.err{border-color:#C62828!important;background:#FFF5F5!important}
.num{flex:none;width:28px;height:28px;border-radius:14px;background:#1E2428;color:#FFF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tbtn{width:100%;height:72px;border:2px solid #1E2428;border-radius:12px;background:#FFF;display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer}
.tbtn .t{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;color:#1B1D1F}
.bigv{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700}
.chip{min-height:46px;border:2px solid #C9CCCF;border-radius:8px;background:#FFF;font-size:16px;font-weight:600;color:#1B1D1F;cursor:pointer;padding:4px 6px;line-height:1.15}
.chip.on,.tog.on{border-color:#1E2428;background:#1E2428;color:#FFF}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gerr{outline:2px solid #C62828;outline-offset:4px;border-radius:10px}
.ta{width:100%;border:2px solid #C9CCCF;border-radius:10px;background:#FFF;padding:12px 14px;font-family:inherit;font-size:16px;color:#1B1D1F;resize:none}
.tog{height:56px;border:2px solid #C9CCCF;border-radius:10px;background:#FFF;font-size:19px;font-weight:700;color:#1B1D1F;cursor:pointer}
.est{width:100%;height:64px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:20px;font-weight:700;cursor:pointer}
.op{border:3px solid #1F6B45;background:#FFF;color:#1F6B45}.op.on{background:#1F6B45;color:#FFF}
.fs{border:3px solid #B8430E;background:#FFF;color:#8F330A}.fs.on{background:#B8430E;color:#FFF}
.foot{position:sticky;bottom:0;padding:16px 20px 24px;background:#FFF;border-top:1px solid #DCDEE0;display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:110px 1fr;gap:10px}
.back{height:60px;border-radius:12px;border:2px solid #C9CCCF;background:#FFF;color:#1B1D1F;font-size:18px;font-weight:600;cursor:pointer}
.next{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border:0;border-radius:12px;background:#F2B705;font-size:20px;font-weight:700;color:#1B1D1F;cursor:pointer}
.send{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border:0;border-radius:12px;background:#1E2428;color:#FFF;font-size:20px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6}
.big{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.small{font-size:12px;font-weight:600;color:#5A6067;text-transform:uppercase}
.card{background:#FFF;border:2px solid #DCDEE0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sum{margin-top:10px;background:#FFF;border:2px solid #DCDEE0;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600}
.cal{max-width:300px;margin:0 auto;background:#FFF;border:2px solid #DCDEE0;border-radius:12px;padding:10px 8px}
.cal .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{height:34px;padding:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;border:2px solid transparent;background:#F2F2EF;color:#1B1D1F}
.day.today{border-color:#1E2428;background:#FFF}
.day.sel{border-color:#1E2428;background:#1E2428;color:#FFF}
.ov{position:fixed;inset:0;z-index:10;background:rgba(20,22,24,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.dlg{width:100%;max-width:350px;max-height:100%;display:flex;flex-direction:column;background:#FFF;border-radius:16px;overflow:hidden}
.dh{background:#1E2428;color:#FFF;padding:16px 20px}
.dh .k{font-size:14px;font-weight:600;color:#D5D9DC}
.dh .h{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700}
.dbody{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 16px}
.alert{color:#B3261E;font-size:15px;font-weight:600}
.cola{background:#F2B705;color:#1B1D1F;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700;text-align:center}
.quitar{width:100%;height:48px;border-color:#C62828;color:#8E1B14}
.banner{border:2px solid #C62828;background:#FFF5F5;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.banner .r{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:#8E1B14}
.banner button{flex:none;height:44px;padding:0 12px;border:2px solid #C62828;border-radius:8px;background:#FFF;color:#8E1B14;font-size:15px;font-weight:700;cursor:pointer}
.badge{flex:none;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700}
.b-op{background:#E3F1E8;color:#1F6B45}.b-fs{background:#FBE9E1;color:#8F330A}
.clock{position:relative;width:280px;height:280px;border-radius:50%;background:#F2F2EF}
.ck{position:absolute;border:0;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;background:transparent;color:#1B1D1F}
.ck.sel{background:#1E2428;color:#FFF}
.seg{border:0;background:transparent;padding:0 4px;font:inherit;cursor:pointer;color:#8A9096}
.seg.on{color:#F2B705}
img.hero{display:block;width:100%;aspect-ratio:1220/742;object-fit:cover;border-radius:12px}
#impresion{display:none}
@media print{
  body{background:#FFF}
  #app{display:none!important}
  #impresion{display:block!important}
  #impresion .titimp{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin:0 0 10px}
  @page{margin:15mm}
  #impresion .pag{break-after:page;page-break-after:always}
  #impresion .pag:last-child{break-after:auto;page-break-after:auto}
  #impresion .card div{font-size:18px!important}
  #impresion .card .small{font-size:13px!important}
  #impresion .card .big{font-size:26px!important}
  #impresion .card{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px;border:1px solid #888;gap:8px}
  #impresion .g3{background:#F2F2EF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="tema-azul">
/* Tema azul noche (colores nuevos) */
body,#app{background:#0D1626!important;background-image:radial-gradient(circle at 50% 0%,#1A2F55 0%,#0D1626 60%)!important;color:#EAF2FF}
.top{background:#081020;border-bottom:3px solid #22B8FF}
.tab{border-color:#2B4A72}
.bar{background:#24385A}
.lbl{color:#7FD4FF}
.hint,.small{color:#9FB3CC!important}
.fld,.ta,.chip,.tog,.tbtn,.back{background:#132341;border-color:#2B4A72;color:#EAF2FF}
.fld::placeholder,.ta::placeholder{color:#6F86A6}
.tbtn .t{color:#EAF2FF}
.chip.on,.tog.on{background:#22B8FF;border-color:#22B8FF;color:#06101F}
.num{background:#F2B705;color:#06101F}
.card,.sum,.cal{background:#132341;border-color:#2B4A72;color:#EAF2FF}
.cal .big,.cal div{color:#EAF2FF!important}
.day{background:#0D1A30;color:#EAF2FF}
.day.today{background:#132341;border-color:#22B8FF}
.day.sel{background:#F2B705;border-color:#F2B705;color:#06101F}
.op{background:#0F2A22;border-color:#2BD48A;color:#5BEAA8}.op.on{background:#1F9D63;color:#FFF}
.fs{background:#2E1A12;border-color:#FF7A3D;color:#FFA070}.fs.on{background:#D95A1E;color:#FFF}
.foot{background:#081020;border-top:2px solid #22B8FF}
.send{background:#22B8FF;color:#06101F}
.dlg{background:#132341;color:#EAF2FF}.dh{background:#081020;border-bottom:2px solid #22B8FF}
.clock{background:#0D1A30}.ck{color:#EAF2FF}.ck.sel{background:#F2B705;color:#06101F}
.b-op{background:#0F2A22;color:#5BEAA8}.b-fs{background:#2E1A12;color:#FFA070}
.banner{background:#2A1216;border-color:#FF5A5F}.banner .r,.banner div{color:#FFB3B5!important}.banner button{background:#132341;color:#FFB3B5}
.alert{color:#FF8A8F}.err{background:#2A1216!important}
img.hero{box-shadow:0 0 18px rgba(34,184,255,.45);border:1px solid #2B4A72}
[style*="color:#5A6067"],[style*="color:#4A4F55"]{color:#9FB3CC!important}
[style*="color:#1B1D1F"]{color:#EAF2FF!important}
[style*="background:#FFF;"],[style*="background:#FFF\""],[style*="background:#F2F2EF"]{background:#132341!important}
[style*="solid #C9CCCF"],[style*="solid #DCDEE0"]{border-color:#2B4A72!important}
[stroke="#1B1D1F"]{stroke:#EAF2FF}[stroke="#5A6067"]{stroke:#9FB3CC}
@media print{body,#app{background:#FFF!important;color:#000}}
</style>
</head>

function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function vacios() { return ['','','','','','','','','','']; }
function repVacio() { return { comp: '', np: '', cant: '', pos: '' }; }
function toMin(s) { return parseInt(s.slice(0,2),10) * 60 + parseInt(s.slice(3),10); }
function durMin(a, b) { if (!a || !b) return null; var d = toMin(b) - toMin(a); if (d < 0) d += 1440; return d; }
function durTxt(a, b) { var d = durMin(a, b); return d == null ? '--:--' : Math.floor(d/60) + ':' + pad(d%60); }

    elim: false, marcados: {}, impr: false, mImp: {}, env: false, mEnv: {}, tipos: [], pm: '', dets: [], dt: {}, ab: {}, kg: '', sel: [], trab: '', ans: '', reps: [repVacio()], turno: '', grupo: '', pickedTer: NOW.getDate(),
    ter: '', est: '', obs: '', show: false, sent: false, sending: false, sendErr: '',
    modal: null, tmp: null, err: false, pk: null,
    caexList: S ? S.caexList : CAEX_DEF.slice(), hist: S ? S.hist : null, histErr: '', fCaex: S ? S.fCaex : '', fDate: S ? S.fDate : ''
  };
  return base;
}

function caexSel() { return S.caex ? S.caex.split(', ') : []; }
function nomC(c) { return String(c || '').split(', ').map(function (x) { return x.indexOf('Otros') === 0 ? x : 'CAEX ' + x; }).join(', '); }
function caexReales() { return caexSel().filter(function (x) { return x !== 'Otros'; }); }
function soloOtros() { return S.caex === 'Otros'; }
function set(o) { for (var k in o) S[k] = o[k]; render(); }
function has(t) { return S.tipos.indexOf(t) >= 0; }
function ponerT(t) { return TIPOS.filter(function (x) { return x === t || has(x); }); }
function quitarT(t) { return S.tipos.filter(function (x) { return x !== t; }); }

function faltas() {
  var m1 = [], m2 = [], m3 = [], m4 = [];
  if (S.names.every(function (n) { return !n.trim(); })) m1.push('al menos un mantenedor');
  if (!S.caex) m1.push('N° de CAEX');
  if (caexSel().indexOf('Otros') >= 0 && !S.caexOtro.trim()) m1.push('qué equipo es (Otros)');
  if (caexReales().length > 1) caexReales().forEach(function (c) { if (!String(S.hors[c] || '').trim()) m1.push('horómetro CAEX ' + c); });
  else if (!S.hor && !soloOtros()) m1.push('horómetro');
  if (!S.ini) m1.push('hora de inicio'); if (!S.turno) m1.push('turno'); if (!S.grupo) m1.push('grupo (G1-G4)');
  if (!S.tipos.length) m2.push('tipo de trabajo');
  if (has('Abastecimiento') && !FL.some(function (f) { return Number(S.ab[f]) > 0; }) && !S.ab.aire) m2.push('litros de abastecimiento');
  if (has('Engrase') && !(Number(S.kg) > 0)) m2.push('kg de grasa');
  Object.keys(TXT).forEach(function (t) { if (has(t) && !(S.dt[t] || '').trim()) m2.push(TXT[t].falta); });
  if (!S.dets.length) m2.push('tipo de detención');
  if (!S.sel.length) m2.push('sistema con falla');
  if (S.sel.indexOf('Otro') >= 0 && !S.sisOtro.trim()) m2.push('cuál es el otro sistema');
  if (!S.trab.trim()) m2.push('trabajo realizado');
  if (!S.ans) m3.push('¿se cambió algún componente?');
  if (S.ans === 'si') S.reps.forEach(function (r, i) {
    var f = [];
    if (!r.comp.trim()) f.push('componente');
    if (!r.np.trim()) f.push('N° de parte');
    if (!String(r.cant).trim()) f.push('cantidad');
    if (f.length) m3.push('repuesto ' + (i + 1) + ' (' + f.join(', ') + ')');
  });
  if (!S.ter) m4.push('hora de término');
  if (!S.est) m4.push('estado de entrega');
  return [m1, m2, m3, m4];
}

var A = {

  imprimir: function () {
    var regs = Object.keys(S.mImp);
    if (!regs.length) return alert('Marca al menos un trabajo.');
    var lista = (S.hist || []).filter(function (r) { return S.mImp[r.reg]; })
      .sort(function (a, b) { return (a.caex + a.fecha + a.ini).localeCompare(b.caex + b.fecha + b.ini); });
    var fechas = lista.map(function (r) { return fmtF(r.fecha); }).filter(function (f, i, a) { return a.indexOf(f) === i; }).join(', ');
    document.getElementById('impresion').innerHTML = lista.map(function (r) { return '<div class="pag"><div class="titimp">CONTROL MANTENIMIENTO</div><div class="card">' + tarjeta(r) + '</div></div>'; }).join('');
    setTimeout(function () { window.print(); }, 100);
  },
  marcar: function (reg, on) { if (on) S.marcados[reg] = 1; else delete S.marcados[reg]; set({}); },
  borrarSel: function () {
    var regs = Object.keys(S.marcados);
    if (!regs.length) return alert('Marca al menos un trabajo.');
    var c = prompt('Ingresa la clave para borrar:'); if (!c) return;
    if (!confirm('¿Está seguro de borrar ' + regs.length + (regs.length === 1 ? ' trabajo' : ' trabajos') + '? No se puede deshacer.')) return;
    var ok = 0;
    var fin = function (msg) { if (ok) alert(ok + (ok === 1 ? ' trabajo borrado' : ' trabajos borrados')); if (msg) alert(msg); S.hist = null; set({ elim: false, marcados: {} }); cargarHist(); };
    var sig = function (i) {
      if (i >= regs.length) return fin('');
      api({ accion: 'borrar', reg: regs[i], clave: c }).then(function (r) { if (r === 'ok') { ok++; sig(i + 1); } else fin(r); })
        .catch(function () { fin('Sin conexión. Para borrar necesitas señal.'); });
    };
    sig(0);

function api(datos) {
  var c = new AbortController(); var t = setTimeout(function () { c.abort(); }, 25000);
  var op = datos.metodo === 'GET'
    ? fetch(API + '?accion=' + encodeURIComponent(datos.accion) + '&t=' + Date.now(), { signal: c.signal })
    : fetch(API, { method: 'POST', body: JSON.stringify(datos), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: c.signal });
  return op.then(function (r) { return r.json(); }).then(function (j) { clearTimeout(t); if (!j.ok) throw new Error(j.error || 'Error del servidor'); return j.r; });
}

function imagenTrabajo(r) {
  var W = 1080, P = 50, cv = document.createElement('canvas'), g = cv.getContext('2d');
  var F = 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif', TX = '#1B1D1F', SB = '#5A6067', LN = '#DCDEE0', AM = '#F2B705';
  var ops = [], y = 0;
  function corta(t, f, max) { g.font = f; var ls = [], l = ''; String(t).split('\n').forEach(function (par) { l = ''; par.split(' ').forEach(function (w) { var p = l ? l + ' ' + w : w; if (g.measureText(p).width > max && l) { ls.push(l); l = w; } else l = p; }); ls.push(l); }); return ls; }
  function fila(a, b) { if (!b) return; var fb = '600 32px ' + F, ls = corta(b, fb, W - 2 * P - 330); y += 12; var y0 = y;
    ops.push(function () { g.font = '30px ' + F; g.fillStyle = SB; g.fillText(a, P + 10, y0 + 36); });
    ls.forEach(function (l, i) { var yy = y0 + 36 + i * 42; ops.push(function () { g.font = fb; g.fillStyle = TX; g.fillText(l, P + 330, yy); }); });
    y += 36 + (ls.length - 1) * 42 + 20; var yr = y; ops.push(function () { g.fillStyle = LN; g.fillRect(P, yr, W - 2 * P, 2); }); }
  y = 110;
  ops.push(function () { g.fillStyle = '#1E2428'; g.fillRect(0, 0, W, 90); g.font = '800 40px ' + F; g.fillStyle = AM; g.fillText('CONTROL MANTENIMIENTO', P, 60); });
  var op = r.est === 'Operativo', tit = nomC(r.caex) + ' · ' + fmtF(r.fecha);
  ops.push(function () { g.font = '800 50px ' + F; g.fillStyle = TX; g.fillText(tit, P, 175);
    g.font = '700 30px ' + F; var e = r.est || '', w = g.measureText(e).width + 40; g.fillStyle = op ? '#E3F1E8' : '#FBE9E1'; g.fillRect(W - P - w, 140, w, 50); g.fillStyle = op ? '#1F6B45' : '#8F330A'; g.fillText(e, W - P - w + 20, 176); });
  y = 210;
  ops.push(function () { g.fillStyle = '#F2F2EF'; g.fillRect(P, 210, W - 2 * P, 120); var c = (W - 2 * P) / 3;
    [['Inicio', r.ini || '--:--'], ['Término', r.ter || '--:--'], ['Duración', durTxt(r.ini, r.ter)]].forEach(function (k, i) { g.font = '28px ' + F; g.fillStyle = SB; g.fillText(k[0], P + 20 + i * c, 255); g.font = '800 40px ' + F; g.fillStyle = TX; g.fillText(k[1], P + 20 + i * c, 305); }); });
  y = 340;
  fila('Horómetro', r.hor ? r.hor + ' hrs' : ''); fila('Trabajo', r.tipo); fila('Detención', r.det); fila('Sistemas', r.sis); fila('Trabajo realizado', r.trab);
  fila('Repuestos', r.reps || 'Sin cambio de componente'); fila('Abastecimiento', r.ab); fila('Detalle', r.detalle); fila('Grasa', r.kg ? r.kg + ' kg' : ''); fila('Mantenedores', r.nombres); fila('Observaciones', r.obs);
  y += 30;
  cv.width = W; cv.height = y + P; g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, cv.height);
  ops.forEach(function (f) { f(); });
  g.strokeStyle = AM; g.lineWidth = 6; g.strokeRect(3, 3, W - 6, cv.height - 6);
  return cv;
}
function enviarWsp() {
  var lista = (S.hist || []).filter(function (r) { return S.mEnv[r.reg]; });
  if (!lista.length) return alert('Marca al menos un trabajo');
  var asunto = 'Trabajos CAEX · ' + lista.map(function (r) { return fmtF(r.fecha); }).filter(function (f, i, a) { return a.indexOf(f) === i; }).join(', ');
  var nom = function (r) { return 'Trabajo_' + String(r.caex).replace(/[^\w-]+/g, '_') + '_' + fmtF(r.fecha) + '_' + (r.ini || '').replace(':', ''); };
  var faltan = 0;
  var bajarFoto = function (id, nombre) {
    return api({ accion: 'foto', id: id }).then(function (b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new File([u], nombre, { type: 'image/jpeg' }); })
      .catch(function () { faltan++; return null; });
  };
  Promise.all(lista.map(function (r) {
    var ficha = new Promise(function (ok) { imagenTrabajo(r).toBlob(function (b) { ok(new File([b], nom(r) + '.png', { type: 'image/png' })); }, 'image/png'); });
    var fotos = (r.fotos || []).map(function (id, i) { return bajarFoto(id, nom(r) + '_foto' + (i + 1) + '.jpg'); })
      .concat((r.fotosPend || []).map(function (id, i) { return bajarFoto(id, nom(r) + '_pendiente' + (i + 1) + '.jpg'); }));
    return Promise.all([ficha].concat(fotos));
  }))
    .then(function (grupos) {
      var files = [].concat.apply([], grupos).filter(Boolean);
      if (faltan) alert(faltan + (faltan === 1 ? ' foto no se pudo bajar' : ' fotos no se pudieron bajar') + ' (sin señal). Se envía lo demás.');
      if (navigator.canShare && navigator.canShare({ files: files })) {
        return navigator.share({ files: files, title: asunto, text: asunto }).then(function () { set({ env: false, mEnv: {} }); });
      }
      files.forEach(function (f) { var a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); });
      alert('Este navegador no permite compartir directo. Las imágenes se descargaron; adjúntalas en WhatsApp.');
    }).catch(function (e) { if (e && e.name !== 'AbortError') alert('No se pudo enviar: ' + e); });
}

    return dlg('Abastecimiento · llena solo lo que abasteciste', 'Litros usados', r + (S.err ? '<div class="alert" role="alert">Ingresa los litros de al menos un fluido o marca Aire de partida</div>' : ''), btnQuitar('Abastecimiento', 'Quitar Abastecimiento') + pie('A.abOk()'));
  }
  if (m === 'kg') {
    return dlg('Engrase', '¿Cuántos kg de grasa usaste?', '<div style="display:flex;align-items:center;gap:10px"><input class="fld" style="height:56px;font-size:22px;text-align:right" aria-label="Kilos de grasa" type="number" inputmode="decimal" placeholder="0" value="' + esc(S.tmp) + '" oninput="A.tmp(null,this.value)"><div style="font-size:20px;font-weight:700;color:#4A4F55">kg</div></div>' + (S.err ? '<div class="alert" role="alert">Ingresa los kg de grasa</div>' : ''), btnQuitar('Engrase', 'Quitar Engrase') + pie('A.kgOk()'));
  }
  if (m === 'txt') {
    var t = TXT[S.txtTipo];
    return dlg(S.txtTipo, t.titulo, '<textarea rows="3" class="ta" style="font-size:17px" aria-label="' + t.titulo + '" placeholder="' + t.ph + '" oninput="A.tmp(null,this.value)">' + esc(S.tmp) + '</textarea>' + (S.err ? '<div class="alert" role="alert">Escribe el detalle</div>' : ''), btnQuitar(S.txtTipo, 'Quitar ' + S.txtTipo) + pie('A.txtOk()'));
  }
  if (m === 'pk') return reloj();
  return '';
}

function reloj() {
  var pk = S.pk, C = 140, items = '', hand;
  var place = function (k, R, s) { var a = k * 30 * Math.PI / 180; return 'left:' + Math.round(C + R * Math.sin(a) - s / 2) + 'px;top:' + Math.round(C - R * Math.cos(a) - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px;'; };
  var k, v;
  if (pk.mode === 'h') {
    for (k = 0; k < 12; k++) { v = k === 0 ? 12 : k; items += '<button type="button" class="ck' + (pk.h === v ? ' sel' : '') + '" aria-label="' + v + ' horas" onclick="A.pkH(' + v + ')" style="' + place(k, 110, 44) + 'font-size:19px">' + v + '</button>'; }
    for (k = 0; k < 12; k++) { v = k === 0 ? 0 : k + 12; items += '<button type="button" class="ck' + (pk.h === v ? ' sel' : '') + '" aria-label="' + v + ' horas" onclick="A.pkH(' + v + ')" style="' + place(k, 68, 40) + 'font-size:15px;' + (pk.h === v ? '' : 'color:#4A4F55') + '">' + pad(v) + '</button>'; }
    var R = (pk.h === 0 || pk.h > 12) ? 68 : 110;
    hand = 'left:139px;top:' + (140 - R) + 'px;height:' + R + 'px;transform:rotate(' + ((pk.h % 12) * 30) + 'deg)';
  } else {
    for (k = 0; k < 12; k++) { v = k * 5; items += '<button type="button" class="ck' + (pk.m === v ? ' sel' : '') + '" aria-label="' + v + ' minutos" onclick="A.pkM(' + v + ')" style="' + place(k, 110, 44) + 'font-size:18px">' + pad(v) + '</button>'; }
    hand = 'left:139px;top:30px;height:110px;transform:rotate(' + (pk.m * 6) + 'deg)';
  }
  var tit = pk.target === 'ter' ? 'Hora de término' : 'Hora de inicio';
  return '<div class="ov"><div class="dlg" role="dialog" aria-label="' + tit + '"><div class="dh"><div class="k">' + tit + '</div>' +
    '<div style="display:flex;align-items:center;justify-content:center;font-family:\'Barlow Condensed\',sans-serif;font-size:60px;font-weight:700;line-height:1.1">' +
    '<button type="button" class="seg' + (pk.mode === 'h' ? ' on' : '') + '" aria-label="Elegir hora" onclick="A.pkMode(\'h\')">' + pad(pk.h) + '</button><span style="color:#D5D9DC;padding:0 2px">:</span>' +
    '<button type="button" class="seg' + (pk.mode === 'm' ? ' on' : '') + '" aria-label="Elegir minutos" onclick="A.pkMode(\'m\')">' + pad(pk.m) + '</button></div></div>' +
    '<div style="padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px"><div class="hint">' + (pk.mode === 'm' ? 'Toca los minutos' : 'Toca la hora (anillo interior: 13 a 00)') + '</div>' +
    '<div class="clock"><div style="position:absolute;width:2px;background:#1E2428;transform-origin:50% 100%;' + hand + '"></div><div style="position:absolute;left:135px;top:135px;width:10px;height:10px;border-radius:50%;background:#1E2428"></div>' + items + '</div>' +
    '<button type="button" onclick="A.pkNow()" style="height:44px;padding:0 16px;border:2px solid #C9CCCF;border-radius:10px;background:#FFF;font-size:16px;font-weight:600;color:#1B1D1F;cursor:pointer">Usar hora actual</button></div>' +
    pie('A.pkOk()') + '</div></div>';
}

function render() {
  var f = faltas();
  var bad = function (c) { return S.show && c; };
  var isForm = S.view === 'form';
  var h = '<div class="top"><div style="display:flex;justify-content:space-between;align-items:center"><div class="title">CONTROL MANTENIMIENTO</div><div style="font-size:14px;font-weight:600;color:#F2B705">' +
    (isForm ? (S.sent ? 'Enviado' : 'Paso ' + S.step + ' de 4') : 'Historial') + '</div></div>' +
    '<div class="tabs"><button type="button" class="tab' + (isForm ? ' on' : '') + '" onclick="A.tab(\'form\')">Nuevo registro</button><button type="button" class="tab' + (!isForm ? ' on' : '') + '" onclick="A.tab(\'hist\')">Historial</button></div>';
  if (isForm) {
    h += '<div class="bars">';
    for (var n = 1; n <= 4; n++) h += '<div class="bar' + (S.show && f[n - 1].length ? ' bad' : (S.sent || n <= S.step) ? ' on' : '') + '"></div>';
    h += '</div><div class="sub">' + (S.sent ? 'Registro completo' : SUBS[S.step - 1] + (S.step > 1 ? ' · ' + (S.caex ? esc(nomC(S.caex)) : 'CAEX [N°]') : '')) + '</div>';
  }
  var nc = leerCola().length;
  if (nc) h += '<div class="cola">📤 ' + nc + (nc === 1 ? ' trabajo pendiente' : ' trabajos pendientes') + ' de envío · se enviará' + (nc === 1 ? '' : 'n') + ' solo' + (nc === 1 ? '' : 's') + ' al tener señal</div>';
  h += '</div>';
  if (!isForm) h += historial();
  else if (S.sent) h += enviado();
  else h += [paso1, paso2, paso3, paso4][S.step - 1](bad, f);
  h += modal();
  document.getElementById('app').innerHTML = h;
}

render();
try { var lc = JSON.parse(localStorage.getItem('cm_caex') || 'null'); if (lc && lc.length) S.caexList = lc; } catch (e) {}
render();
api({ metodo: 'GET', accion: 'caex' }).then(function (l) { if (l && l.length) { try { localStorage.setItem('cm_caex', JSON.stringify(l)); } catch (e) {} set({ caexList: l }); } }).catch(function () {});
enviarCola();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
